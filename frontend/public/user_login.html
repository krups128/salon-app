<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: white;
            padding: 20px;
        }
        /* Input Box Styling */
        .form-control {
            border: 3px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
        }
        .form-control:focus {
            border-color: #d2ab7c; /* Change to desired color */
            outline: none;
            box-shadow: none;
        }
        /* Login Button Styling */
        .btn-login {
            background-color: #c9c2b7; /* Desired color */
            color: rgb(12, 12, 12);
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }
        .btn-login:hover {
            background-color: #c9c2b7; /* Darker shade */
        }
        /* Forgot Password Styling */
        .forgot-password {
            color: #030303; /* Desired color */
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s ease-in-out;
        }
        .forgot-password:hover {
            color: #c9c2b7; /* Darker shade */
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card" style="width: 600px; height: auto;">
            <h3 class="text-center">Customer Login</h3>
            <form onsubmit="loginRedirect(event)">
                <div class="mb-3">
                    <label for="adminId" class="form-label">Customer ID</label>
                    <input type="text" class="form-control" id="adminId" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <a href="user_home.html" class="btn btn-login w-100">Login</a>

            </form>
            
            <script>
                function loginRedirect(event) {
                    event.preventDefault(); // Prevent form submission
                    window.location.href = "dashboard.html"; // Redirect to dashboard
                }
            </script>
            
            <div class="text-center mt-3">
                <a href="user_forgotpassword.html" class="forgot-password">Forgot Password?</a> 
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
