<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .review-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: white;
            padding: 20px;
        }
        .star-rating {
            font-size: 24px;
            color: #ddd;
            cursor: pointer;
        }
        .star-rating .fa-star {
            transition: color 0.2s ease-in-out;
        }
        .star-rating .fa-star:hover,
        .star-rating .fa-star.checked {
            color: #b38b59; /* Soft Gold */
        }
        .btn-submit {
            background-color: #b38b59;
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }
        .btn-submit:hover {
            background-color: #8a6847;
        }
        .review-list .review-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }
        .review-list .review-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Customer Reviews</h2>
        
        <!-- Review Submission Form -->
        <div class="card review-card mx-auto" style="max-width: 500px;">
            <h4 class="text-center">Leave a Review</h4>
            <div class="mb-3 text-center">
                <label class="form-label">Your Rating</label>
                <div class="star-rating" id="stars">
                    <i class="fas fa-star" data-value="1"></i>
                    <i class="fas fa-star" data-value="2"></i>
                    <i class="fas fa-star" data-value="3"></i>
                    <i class="fas fa-star" data-value="4"></i>
                    <i class="fas fa-star" data-value="5"></i>
                </div>
            </div>
            <div class="mb-3">
                <label for="reviewText" class="form-label">Your Review</label>
                <textarea class="form-control" id="reviewText" rows="3" placeholder="Write your review here..." required></textarea>
            </div>
            <button class="btn btn-submit w-100" onclick="submitReview()">Submit Review</button>
        </div>

        <!-- Display Submitted Reviews -->
        <div class="mt-5">
            <h4>Recent Reviews</h4>
            <div class="review-list" id="reviewList">
                <!-- Reviews will appear here -->
            </div>
        </div>
    </div>

    <script>
        let selectedRating = 0;

        // Function to handle star selection
        document.querySelectorAll(".star-rating .fa-star").forEach(star => {
            star.addEventListener("click", function () {
                selectedRating = parseInt(this.getAttribute("data-value"));
                highlightStars(selectedRating);
            });
        });

        // Function to highlight selected stars
        function highlightStars(rating) {
            document.querySelectorAll(".star-rating .fa-star").forEach((star, index) => {
                star.classList.toggle("checked", index < rating);
            });
        }

        // Function to submit review
        function submitReview() {
            let reviewText = document.getElementById("reviewText").value;
            let reviewList = document.getElementById("reviewList");

            if (selectedRating === 0 || reviewText.trim() === "") {
                alert("Please select a rating and write a review before submitting.");
                return;
            }

            // Create review item
            let reviewItem = document.createElement("div");
            reviewItem.classList.add("review-item");

            reviewItem.innerHTML = `
                <div>
                    ${'<i class="fas fa-star checked"></i>'.repeat(selectedRating)}
                    ${'<i class="fas fa-star" style="color:#ddd;"></i>'.repeat(5 - selectedRating)}
                </div>
                <p>${reviewText}</p>
                <small class="text-muted">Just now</small>
            `;

            reviewList.prepend(reviewItem);
            document.getElementById("reviewText").value = ""; // Clear input
            selectedRating = 0; // Reset rating
            highlightStars(0);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
