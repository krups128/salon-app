<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .forgot-password-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: white;
            padding: 20px;
        }
        /* Input Box Styling */
        .form-control {
            border: 3px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
        }
        .form-control:focus {
            border-color: #d2ab7c; /* Change to desired color */
            outline: none;
            box-shadow: none;
        }
        /* Reset Password Button */
        .btn-reset {
            background-color: #c9c2b7; /* Desired color */
            color: rgb(7, 7, 7);
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }
        .btn-reset:hover {
            background-color: #c9c2b7; /* Darker shade */
        }
        /* Back to Login Button */
        .btn-back {
            background: none;
            border: none;
            color: #080808; /* Desired color */
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease-in-out;
        }
        .btn-back:hover {
            color: #c9c2b7; /* Darker shade */
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card forgot-password-card" style="width: 500px; height: auto;">
            <h3 class="text-center">Forgot Password</h3>
            
            <form onsubmit="resetPassword(event)">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <a href="user_changepassword.html" class="btn btn-reset w-100">Reset Password</a>
               
            </form>
            
            <script>
                function resetPassword(event) {
                    event.preventDefault(); // Prevent form submission
                    alert("A password reset link has been sent to your email.");
                }
            </script>
            
            <div class="text-center mt-3">
                <button class="btn-back" onclick="window.location.href='user_login.html'">Back to Login</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
