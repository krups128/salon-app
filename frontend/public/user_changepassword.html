<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .change-password-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: white;
            padding: 20px;
        }
        /* Input Box Styling */
        .form-control {
            border: 3px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
        }
        .form-control:focus {
            border-color: #d2ab7c; /* Change to desired color */
            outline: none;
            box-shadow: none;
        }
        /* Update Password Button */
        .btn-update {
            background-color: #c9c2b7; /* Desired color */
            color: rgb(12, 12, 12);
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }
        .btn-update:hover {
            background-color: #c9c2b7; /* Darker shade */
        }
        /* Back to Login Button */
        .btn-back {
            background: none;
            border: none;
            color: #030303; /* Desired color */
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease-in-out;
        }
        .btn-back:hover {
            color: #c9c2b7; /* Darker shade */
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card change-password-card" style="width: 500px; height: auto;">
            <h3 class="text-center">Change Password</h3>
            <form onsubmit="updatePassword(event)">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Current Password</label>
                    <input type="password" class="form-control" id="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                <button type="button" class="btn btn-update w-100" onclick="window.location.href='user_login.html'">
                    Update Password
                  </button>
                  
            </form>
            
            <script>
                function updatePassword(event) {
                    event.preventDefault(); // Prevent form submission
                    alert("Your password has been updated successfully.");
                }
            </script>
            
            <div class="text-center mt-3">
                <button class="btn-back" onclick="window.location.href='user_login.html'">Back to Login</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
